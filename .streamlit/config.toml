# Visual theme. The default Streamlit red (#FF4B4B) is loud on a page that is
# almost entirely numbers, and it competes with the red/green that actually
# carry meaning here (loss/gain). Accent is a deep blue, used only on the
# active tab, focus rings and the chart.
[theme]
base = "light"
primaryColor = "#1C5CAB"
backgroundColor = "#FBFBFA"
secondaryBackgroundColor = "#F2F2EF"
textColor = "#1A1A18"
font = "sans serif"

# "Clear filters" on the Trades tab resets each filter by writing its value
# into st.session_state — the only way to change a widget bound to the URL —
# while the same widgets also declare a default ("All"). Streamlit logs a
# warning for that pairing on the first reset; here it is intended.
[global]
disableWidgetStateDuplicationWarning = true
